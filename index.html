<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>深圳二手房成交查询</title>
<meta name="description" content="深圳二手房成交记录快速筛选查询：13,460 条真实成交，按小区/片区/面积/总价/单价/砍价幅度/建成年份等条件秒筛，含 CSV 导出（2025-04 ~ 2026-09）">
<meta property="og:type" content="website">
<meta property="og:title" content="深圳二手房成交查询">
<meta property="og:description" content="13,460 条深圳二手房成交记录，按小区/片区/面积/总价/单价/砍价幅度等条件快速筛选，含 CSV 导出">
<meta property="og:image" content="https://geeklj1.github.io/shenzhen-resale-deals/og.png">
<meta property="og:url" content="https://geeklj1.github.io/shenzhen-resale-deals/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f8;
  --text:#0f172a; --text-2:#5a6675; --text-3:#98a3b2;
  --line:#e7ebf1; --line-2:#d9e0ea;
  --primary:#2563eb; --primary-ink:#1d4ed8; --primary-soft:#eaf1ff;
  --ok:#0f9d6e; --ok-soft:#e6f7f1;
  --warn:#b26a00; --warn-soft:#fff6e6;
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(15,23,42,.05);
  --sh-2:0 2px 10px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --sh-3:0 18px 44px rgba(15,23,42,.16);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0e15; --surface:#131a24; --surface-2:#182130; --surface-3:#1e2836;
    --text:#e9eef7; --text-2:#96a2b4; --text-3:#69748a;
    --line:#222c3b; --line-2:#2b3745;
    --primary:#5b8cff; --primary-ink:#85a8ff; --primary-soft:#17243d;
    --ok:#34d399; --ok-soft:#10281f;
    --warn:#f0b429; --warn-soft:#2a2113;
    --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 2px 12px rgba(0,0,0,.4); --sh-3:0 18px 44px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:var(--safe-b);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;font-variant-numeric:tabular-nums}

/* ── 头部 ───────────────────────────── */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 11px) 16px 11px;
  display:flex;align-items:center;gap:11px}
.logo{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary),#7c3aed);color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 4px 12px rgba(37,99,235,.28)}
.appbar .tt{min-width:0}
.appbar h1{margin:0;font-size:16.5px;font-weight:750;letter-spacing:.1px}
.appbar .sub{color:var(--text-3);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 搜索 + 筛选 ────────────────────── */
.searchbar{position:sticky;top:calc(var(--safe-t) + 57px);z-index:19;background:var(--surface);
  border-bottom:1px solid var(--line);padding:9px 16px 11px;display:flex;gap:9px}
.searchbar .box{position:relative;flex:1;min-width:0}
.searchbar .box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.searchbar input{width:100%;padding:11px 12px 11px 34px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);font-size:14.5px}
.searchbar input:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
#filterBtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:11px 14px;font-weight:650;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-1)}
#filterBtn:active{background:var(--surface-2)}
#filterBtn.on{border-color:transparent;background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}
#activeCount{display:none;min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:9px;
  background:rgba(255,255,255,.28);font-size:11px;font-weight:700;text-align:center}
#activeCount.show{display:inline-block}
#filterBtn:not(.on) #activeCount{background:var(--primary);color:#fff}

/* ── 预设 ───────────────────────────── */
.presets{display:flex;gap:8px;overflow-x:auto;padding:11px 16px 3px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:13px;font-weight:550;color:var(--text-2);box-shadow:var(--sh-1)}
.presets button.p{border-color:transparent;background:var(--primary);color:#fff;font-weight:650;
  box-shadow:0 4px 12px rgba(37,99,235,.26)}
.presets button:not(.p):active{background:var(--surface-3)}

/* ── 概览 ───────────────────────────── */
.stats{padding:11px 16px 3px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumchip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;box-shadow:var(--sh-1)}
.sumchip .k{color:var(--text-3);font-size:11px;font-weight:600}
.sumchip .v{font-weight:750;font-size:17px;letter-spacing:-.2px;margin-top:1px}
.sumchip .v small{font-size:11.5px;font-weight:600;color:var(--text-3);margin-left:2px}
.sumchip.lead .v{font-size:19px}
.sumline{margin-top:8px;color:var(--text-2);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.sumline b{color:var(--text);font-weight:650}

/* ── 结果条 ─────────────────────────── */
.listbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 7px}
#count{color:var(--text-2);font-size:12.5px}
#count b{color:var(--text);font-weight:700}
.listbar .right{display:flex;gap:6px;align-items:center}
.select-wrap{position:relative}
.select-wrap:after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;margin-top:-4px;
  border-right:1.6px solid var(--text-3);border-bottom:1.6px solid var(--text-3);transform:rotate(45deg);pointer-events:none}
#sort{appearance:none;-webkit-appearance:none;padding:8px 26px 8px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);font-size:12.5px;font-weight:600}
#dirBtn{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-size:14px;font-weight:700;box-shadow:var(--sh-1)}
#dirBtn:active{background:var(--surface-2)}

/* ── 卡片 ───────────────────────────── */
.list{display:grid;grid-template-columns:1fr;gap:10px;padding:4px 16px 10px}
@media(min-width:700px){.list{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px 13px;
  box-shadow:var(--sh-2);transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.993);box-shadow:var(--sh-1)}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-size:16.5px;font-weight:750;letter-spacing:-.1px;line-height:1.3}
.name:active{color:var(--primary)}
.date{flex:0 0 auto;color:var(--text-3);font-size:11.5px;font-weight:600}
.meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.spec{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;
  background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:550}
.spec.loc{background:var(--primary-soft);color:var(--primary-ink)}
.price{margin-top:11px;display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.total{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1}
.total small{font-size:12px;font-weight:650;color:var(--text-2);margin-left:2px;letter-spacing:0}
.unit{font-size:12.5px;font-weight:650;color:var(--text-2);padding-bottom:2px}
.neg{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);
  padding:3px 9px;border-radius:999px}
.tags{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);display:flex;align-items:center;
  gap:7px;flex-wrap:wrap;color:var(--text-3);font-size:11.5px}
.tag{padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-2);font-weight:600}
.tag.dup{background:var(--warn-soft);color:var(--warn)}

.listfoot{padding:8px 16px 4px;display:flex;gap:9px}
.listfoot button{flex:1;padding:13px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);font-weight:650;font-size:14px;box-shadow:var(--sh-1)}
.listfoot button:active{background:var(--surface-2)}
.empty{grid-column:1/-1;text-align:center;color:var(--text-2);padding:52px 20px;font-size:14px}
.empty button{margin-top:14px;padding:11px 20px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);font-weight:600}

.tail{padding:8px 16px 24px;display:flex;gap:9px}
.tail button{flex:1;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--text-2)}
.tail button:active{background:var(--surface-2)}
.note{margin:0 16px 30px;color:var(--text-3);font-size:12px;line-height:1.75}
.note summary{cursor:pointer;font-weight:650;color:var(--text-2)}
.note p{margin:8px 0 0}

/* ── 筛选抽屉 ───────────────────────── */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(9,13,20,.5);display:none;
  backdrop-filter:-webkit-backdrop-filter:blur(2px)}
.sheet.open{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-inner{position:absolute;left:0;right:0;bottom:0;max-height:91vh;overflow:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:8px 18px calc(var(--safe-b) + 16px);box-shadow:var(--sh-3);
  animation:up .24s cubic-bezier(.22,.9,.3,1);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:6px auto 12px}
@media(min-width:700px){
  .sheet-inner{left:auto;right:24px;bottom:24px;top:24px;width:640px;border-radius:20px;max-height:none;
    animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.98);opacity:.5}to{transform:none;opacity:1}}
  .sheet-grip{display:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:17px;font-weight:750}
.sheet-head .x{padding:8px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--text-2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:419px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.span2{grid-column:1/-1}
.field>label,.legend{font-size:12px;color:var(--text-3);font-weight:650;letter-spacing:.1px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface-2);font-size:14.5px}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus{outline:none;border-color:var(--primary);
  background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.rng{display:flex;align-items:center;gap:7px}
.rng input{flex:1 1 0;min-width:0;text-align:center}
.rng span{color:var(--text-3);flex:0 0 auto;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font-size:13px;font-weight:550;color:var(--text-2)}
.chip input{margin:0;accent-color:var(--primary);width:15px;height:15px}
.chip:has(input:checked){background:var(--primary-soft);border-color:transparent;color:var(--primary-ink);font-weight:650}
.radios{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;align-items:center}
.radios label{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.radios input{accent-color:var(--primary);width:16px;height:16px}
.sheet-actions{position:sticky;bottom:-16px;display:flex;gap:10px;margin-top:18px;
  padding:14px 0 6px;background:linear-gradient(180deg,transparent,var(--surface) 22%)}
.sheet-actions button{flex:1;padding:15px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--surface);font-weight:700;font-size:15px}
.sheet-actions button.primary{background:var(--primary);border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(37,99,235,.3)}
.sheet-actions button:active{transform:scale(.99)}
</style>
</head>
<body>

<header class="appbar">
  <div class="logo">深</div>
  <div class="tt">
    <h1>二手房成交查询</h1>
    <div class="sub" id="meta">正在加载数据…</div>
  </div>
</header>

<div class="searchbar">
  <div class="box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" type="search" inputmode="search" placeholder="搜小区 / 片区 / 区" aria-label="关键词">
  </div>
  <button id="filterBtn" aria-expanded="false">筛选<span id="activeCount">0</span></button>
</div>

<div class="presets" id="presetBox">
  <button class="p" data-preset="all">全部</button>
  <button data-preset="recent30">近 1 个月</button>
  <button data-preset="recent90">近 3 个月</button>
  <button data-preset="recent180">近 6 个月</button>
  <button data-preset="nanshan">南山区</button>
  <button data-preset="haggle10">砍价≥10%</button>
  <button data-preset="bargain-hunt">捡漏 ≤1000万</button>
  <button data-preset="core90">刚需 60–90㎡</button>
  <button data-preset="small">小户型 ≤60㎡</button>
</div>

<div class="stats" id="stats"></div>

<div class="listbar">
  <span id="count"></span>
  <span class="right">
    <span class="select-wrap"><select id="sort" aria-label="排序">
      <option value="date">成交日期</option>
      <option value="unit">单价</option>
      <option value="total">总价</option>
      <option value="area">面积</option>
      <option value="neg">谈价率</option>
      <option value="community">小区</option>
      <option value="district">行政区</option>
      <option value="area_group">片区</option>
      <option value="built_year">建成年份</option>
      <option value="facing">朝向</option>
    </select></span>
    <button id="dirBtn">↓</button>
  </span>
</div>

<div class="list" id="list"></div>

<div class="listfoot">
  <button id="moreBtn">加载更多</button>
</div>

<div class="tail">
  <button id="exportBtn">导出 CSV</button>
  <button id="shareBtn">复制筛选链接</button>
</div>

<div class="note">
  <details>
    <summary>数据说明与口径</summary>
    <p>本页为<strong>公开渠道整理的成交记录汇编</strong>，经图表识别与一致性校验后结构化，<strong>非官方备案数据</strong>。
    样本覆盖面有限，请以价格分布与趋势为主要参考，不要当作全市成交量。</p>
    <p>部分记录来自大型中介的成交整理，含少量公寓/商办/宿舍；双拼房源可能被拆成两条（需相加）。
    部分记录没有逐行成交日期，用其统计期的起始日代替。</p>
    <p>「谈价率」= 相对最后一次挂盘价的差值（负数即砍价）。「可能重复」表示可能存在同一笔成交的另一条记录，
    可用上方「去重口径」切换是否排除。</p>
  </details>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="筛选条件">
  <div class="sheet-inner">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>筛选条件</h2>
      <button class="x" id="closeSheet">收起</button>
    </div>
    <div class="fgrid">
      <div class="field span2">
        <label for="groups">片区（可多选，空格分隔）</label>
        <input id="groups" type="text" list="groupList" placeholder="如：后海 蛇口 科技园">
        <datalist id="groupList"></datalist>
      </div>
      <div class="field">
        <label>成交日期</label>
        <input id="dateFrom" type="date" aria-label="起始日期">
        <input id="dateTo" type="date" aria-label="结束日期">
      </div>
      <div class="field">
        <label>面积 (㎡)</label>
        <div class="rng"><input id="areaMin" type="number" inputmode="decimal" placeholder="最小">
          <span>~</span><input id="areaMax" type="number" inputmode="decimal" placeholder="最大"></div>
        <label>总价 (万)</label>
        <div class="rng"><input id="totalMin" type="number" inputmode="decimal" placeholder="最小">
          <span>~</span><input id="totalMax" type="number" inputmode="decimal" placeholder="最大"></div>
      </div>
      <div class="field">
        <label>单价 (万/㎡)</label>
        <div class="rng"><input id="unitMin" type="number" inputmode="decimal" step="0.1" placeholder="最小">
          <span>~</span><input id="unitMax" type="number" inputmode="decimal" step="0.1" placeholder="最大"></div>
        <label>建成年份</label>
        <div class="rng"><input id="builtMin" type="number" inputmode="numeric" placeholder="如 2005">
          <span>~</span><input id="builtMax" type="number" inputmode="numeric" placeholder="如 2020"></div>
      </div>
      <div class="field span2">
        <label>谈价率 %（负数=砍价）</label>
        <div class="rng"><input id="negMin" type="number" inputmode="decimal" placeholder="如 -30">
          <span>~</span><input id="negMax" type="number" inputmode="decimal" placeholder="如 -10"></div>
      </div>
      <div class="field span2">
        <label class="legend">行政区</label>
        <div class="chips" id="districts"></div>
      </div>
      <div class="field span2">
        <label class="legend">房数</label>
        <div class="chips" id="rooms"></div>
      </div>
      <div class="field span2">
        <label class="legend">朝向</label>
        <div class="chips" id="facings"></div>
      </div>
      <div class="field span2">
        <label class="legend">去重口径</label>
        <div class="radios">
          <label><input type="radio" name="dedupe" value="raw">原始</label>
          <label><input type="radio" name="dedupe" value="strict">严格并集</label>
          <label><input type="radio" name="dedupe" value="loose">宽松并集</label>
          <label><input type="checkbox" id="onlyDup">只看可能重复</label>
        </div>
      </div>
    </div>
    <div class="sheet-actions">
      <button id="resetBtn">重置</button>
      <button class="primary" id="applyBtn">查看结果</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
